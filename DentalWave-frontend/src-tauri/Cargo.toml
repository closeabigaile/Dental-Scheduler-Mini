[package]
name = "dental-scheduler-mini"
version = "0.7.0"
description = "Offline desktop scheduling with local or portable SQLite storage"
edition = "2021"
rust-version = "1.89"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "dental_scheduler_mini_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std"] }
tauri = { version = "2.11.3", features = [] }
rusqlite = { version = "0.40.0", features = ["bundled", "backup"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
same-file = "1"
tempfile = "3"

[profile.release]
strip = true
debug = false
